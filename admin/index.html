<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boyfriend Dashboard</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#171116;color:#fff;margin:0}.w{max-width:680px;margin:auto;padding:36px 18px}h1{font-size:34px}.muted{color:#b9aeb5}.login,.card{background:#241b22;border:1px solid #44323f;border-radius:20px;padding:18px;margin:12px 0}input,button{font:inherit;border:0;border-radius:12px;padding:12px}input{width:100%;box-sizing:border-box;margin:8px 0;background:#fff}button{background:#f07c98;color:#fff;font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.reset{background:#4a3845;font-size:12px}.empty{padding:30px 0;color:#b9aeb5}</style></head><body><main class="w"><h1>🍬 Boyfriend Dashboard</h1><p class="muted">Classified Jellybean operations.</p><section class="login" id="login"><b>Private access</b><input id="key" type="password" placeholder="Dashboard key"><button onclick="load()">Open dashboard</button></section><section id="list"></section></main><script>let token='';async function load(){token=key.value;const r=await fetch('/api/admin',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok){alert('Wrong key');return}login.style.display='none';const d=await r.json();render(d.redeemed)}function render(rows){list.innerHTML=rows.length?rows.sort((a,b)=>b.redeemedAt.localeCompare(a.redeemedAt)).map(x=>`<article class="card"><div class="row"><div><b>${x.title}</b><div class="muted">${new Date(x.redeemedAt).toLocaleString()}</div></div><button class="reset" onclick="resetCoupon('${x.id}')">Reset</button></div></article>`).join(''):'<div class="empty">No coupons redeemed yet. Jellybean is showing restraint.</div>'}async function resetCoupon(id){if(!confirm('Reset this coupon?'))return;await fetch('/api/admin?id='+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}</script></body></html>
